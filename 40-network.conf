# TechniComp Benchtop Linux — network defaults
# Source: notes Performance/Network Tuning.md
# CUBIC + fq_codel are largely kernel/systemd defaults; declared explicitly.
# BBR is a documented opt-in for lossy/high-latency links (requires fq qdisc).
net.ipv4.tcp_congestion_control = cubic
net.core.default_qdisc = fq_codel
