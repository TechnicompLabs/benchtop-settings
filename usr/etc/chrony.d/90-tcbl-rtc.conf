# Technicomp Benchtop Linux: the hardware clock keeps UTC. openSUSE starts
# chronyd with -s (/etc/sysconfig/chronyd), which sets the system clock from the
# hardware clock at boot, and chronyd reads the hardware clock as local time
# unless told otherwise; with the clock in UTC, as systemd keeps it, the time is
# off by the time zone's offset until chronyd's first synchronization.
# rtconutc: the hardware clock keeps UTC. hwclockfile: but follow /etc/adjtime
# when it exists, which `timedatectl set-local-rtc 1` writes on computers that
# also run Windows (it overrides rtconutc).
rtconutc
hwclockfile /etc/adjtime
