# Technicomp Benchtop Linux: updates install only the packages that others
# require, as the image build does (kiwi installs with --no-recommends), so an
# updated system keeps the package set of a new one; as on openSUSE MicroOS.
# Packages that recommend or supplement others no longer bring them along; what
# TCBL needs is listed in its patterns.
[main]
solver.onlyRequires = true
