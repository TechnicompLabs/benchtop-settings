# Technicomp Benchtop Linux: the kernel command line options that cannot be set
# anywhere else. sdbootutil adds this file to /etc/kernel/cmdline for every boot
# entry it writes. A file of the same name in /etc/kernel/cmdline.d replaces it,
# and an empty one there switches it off.
#
# sdbootutil reads vendor files from /usr/kernel/cmdline.d (since March 2026,
# not documented). The spec's %check fails the build if it stops doing so.

# boot messages: only critical ones on screen; Plymouth's splash and its
# graphical disk-password prompt; no console cursor
quiet loglevel=2 splash vt.global_cursor_default=0

# SELinux instead of AppArmor, which openSUSE's kernel selects by default, as
# openSUSE's own SELinux setup (transactional-update setup-selinux) sets it
security=selinux selinux=1

# sdbootutil's check of the disk-unlock measurement (PCR 15) warns instead of
# powering off
measure-pcr-validator.ignore=yes

# desktop latency: interrupt handlers as threads; RCU callbacks moved off every
# CPU (notes: Performance/Kernel Tuning.md)
threadirqs rcu_nocbs=all

# the IOMMU on Intel machines too: openSUSE's kernel leaves
# CONFIG_INTEL_IOMMU_DEFAULT_ON off, although upstream turns it on. The AMD
# IOMMU is on by default; without an Intel DMAR table the option does nothing
intel_iommu=on
