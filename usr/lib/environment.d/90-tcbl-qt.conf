# Technicomp Benchtop Linux: Qt applications use the Kvantum style, with the
# theme chosen in ~/.config/Kvantum/kvantum.kvconfig (KvLibadwaita by default,
# written by tcbl-default-applications.service). "kvantum-auto" (TCBL's
# kvantum package) uses the theme's dark variant when the desktop prefers dark,
# and switches running Qt 6 applications when that changes; Qt 5 applications
# treat it as "kvantum". Flatpak applications get "kvantum" from the system-wide Flatpak
# override (tmpfiles.d/90-tcbl-flatpak.conf), because Flathub's Kvantum
# extension does not have the key.
QT_STYLE_OVERRIDE=kvantum-auto
