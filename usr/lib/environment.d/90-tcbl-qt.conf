# Technicomp Benchtop Linux: Qt applications use the Kvantum style, with the
# theme chosen in ~/.config/Kvantum/kvantum.kvconfig (KvLibadwaita by default,
# written by tcbl-themes.service). Flatpak applications get the same setting
# from the system-wide Flatpak override (tmpfiles.d/90-tcbl-flatpak.conf).
QT_STYLE_OVERRIDE=kvantum
