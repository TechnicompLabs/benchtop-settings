# Technicomp Benchtop Linux: ignore the staggered spin-up flag of AHCI SATA
# controllers, which makes the ahci driver probe the ports one at a time and
# slows the boot. The driver reads this when it loads, in the initrd (dracut
# copies modprobe.d into it) or after it. A libahci.ignore_sss=1 kernel
# parameter would take effect at the same point: for a module, modprobe reads
# it from /proc/cmdline.
options libahci ignore_sss=1
