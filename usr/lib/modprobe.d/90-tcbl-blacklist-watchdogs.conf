# Technicomp Benchtop Linux - disable hardware watchdogs (desktop latency)
# Source: notes Performance/Kernel Tuning.md
# Pairs with sysctl.d/90-tcbl-watchdog.conf (lockup detectors off)
# Blacklist the Intel TCO Watchdog
blacklist iTCO_wdt

# Blacklist the AMD SP5100 TCO Watchdog
blacklist sp5100_tco

# Blacklist the ACPI WDAT (Watchdog Action Table) watchdog. Intel boards whose
# firmware has a WDAT table use this driver instead of iTCO_wdt.
blacklist wdat_wdt
