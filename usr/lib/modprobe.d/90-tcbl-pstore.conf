# Technicomp Benchtop Linux: keep the kernel log of a crash across the reboot.
#
# openSUSE's kernel builds the UEFI backend of pstore switched off; this
# switches it on. At an oops or panic the kernel writes the end of its log
# (about 10 KB) into UEFI variables. At the next boot, systemd-pstore.service
# (enabled by openSUSE's preset; it loads this module) moves the records to
# /var/lib/systemd/pstore and deletes the variables.
options efi_pstore pstore_disable=0
