# Technicomp Benchtop Linux: amdgpu, not radeon, drives Southern Islands (SI,
# first-generation GCN) and Sea Islands (CIK, second-generation GCN) GPUs.
# Kernel 6.19 made amdgpu their default driver, so on Tumbleweed's kernel these
# lines restate the default; on kernel-longterm (6.18) radeon still takes these
# GPUs unless told otherwise.
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0
