# Technicomp Benchtop Linux: /tmp (tmpfs, in memory) holds at most 20% of RAM
# instead of systemd's 50%: 3.2 GB on 16 GB, 6.4 GB on 32 GB. Options= replaces
# the whole list, so the rest repeats systemd's tmp.mount unchanged. Large
# temporary work belongs in /var/tmp, which is on disk.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=20%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
