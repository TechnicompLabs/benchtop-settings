# TechniComp Benchtop Linux: graphical logins only. No text logins start on the
# virtual consoles (Ctrl+Alt+F3 and up); the first console belongs to the login
# screen (85-tcbl.preset turns off the tty1 login).
#
# For a shell to repair a system whose desktop does not start: hold Space while
# the computer starts, to show the boot menu; press e; and add
#     systemd.unit=rescue.target SYSTEMD_SULOGIN_FORCE=1
# to the kernel command line. root has no password, and SYSTEMD_SULOGIN_FORCE=1
# lets the rescue shell start without one. On an installed system the TPM
# unlocks the disk only for the unchanged command line, so the disk then asks
# for its recovery key.
[Login]
NAutoVTs=0
ReserveVT=0
