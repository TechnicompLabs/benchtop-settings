# Technicomp Benchtop Linux: service status messages on the console only when
# a step fails, or when boot or shutdown is still running after 25 seconds.
# With the Plymouth splash up, Esc shows them. The kernel command line's quiet
# would otherwise select error, which shows failures but not a step that hangs.
# dracut copies system.conf.d into the initrd, so this applies there too.
[Manager]
ShowStatus=auto
