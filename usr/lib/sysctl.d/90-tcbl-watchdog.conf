# Technicomp Benchtop Linux: soft and hard lockup detectors off (desktop
# latency; the hard lockup detector also takes a CPU performance counter).
# Pairs with the hardware watchdog blacklist in modprobe.d.
kernel.soft_watchdog = 0
# The - prefix ignores the error that the kernel returns where no hard lockup
# detector is available (for example, in some virtual machines).
-kernel.nmi_watchdog = 0
