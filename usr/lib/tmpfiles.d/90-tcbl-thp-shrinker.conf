# Technicomp Benchtop Linux: THP shrinker (kernel 6.12 and later)
#
# With THP=always (90-tcbl-thp.conf), sparsely used memory receives far more
# huge pages than it needs, which raises memory pressure and can cause early
# OOM kills. Under memory pressure, the shrinker splits a huge page when more
# than max_ptes_none of its 512 base pages are zero-filled. The default, 511,
# leaves the shrinker inactive; 409 splits huge pages that are more than 80%
# zeros. In the upstream patch's measurements, this brought memory use down to
# about that of THP=madvise with the same performance gain.
# khugepaged applies the same limit: it does not collapse a 2 MB range when more
# than 409 of its 512 entries are empty or map the zero page, so it does not
# rebuild the huge pages that the shrinker has split.
# w! writes the value at boot only (see 90-tcbl-thp.conf).
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
