# Technicomp Benchtop Linux: delete core dumps after 3 days instead of the
# 2 weeks that systemd sets.
#
# systemd's systemd.conf creates the directory with a d line and a 2-week
# cleanup age. An e line for the same path does not conflict with it: both
# apply, so systemd-tmpfiles-clean deletes dumps untouched for 3 days.
e /var/lib/systemd/coredump - - - 3d
