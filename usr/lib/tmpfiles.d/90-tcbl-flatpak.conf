# Technicomp Benchtop Linux: a system-wide Flatpak override for all
# applications, in every installation (the system one and each user's): Qt
# applications use the Kvantum style, and can read ~/.config/Kvantum, where
# tcbl-themes.service puts the Kvantum themes and the chosen theme (Flatpak
# binds it into each application's own configuration folder). The file is
# copied once; an administrator's changes to it are kept.
d /var/lib/flatpak/overrides 0755 root root -
C /var/lib/flatpak/overrides/global - - - - /usr/share/tc-benchtop-settings/flatpak-override-global
