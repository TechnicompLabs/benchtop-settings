# Technicomp Benchtop Linux: remove what has not been used for 3 days from /tmp
# (openSUSE: 10 days) and for 30 days from /var/tmp (systemd's own default;
# openSUSE removes nothing there). systemd-tmpfiles-clean.timer applies this
# daily. When several files name the same path, the file whose name sorts first
# wins, so these lines replace those in openSUSE's fs-tmp.conf and
# fs-var-tmp.conf; systemd-tmpfiles logs a notice that it ignores those.
q /tmp 1777 root root 3d
q /var/tmp 1777 root root 30d
