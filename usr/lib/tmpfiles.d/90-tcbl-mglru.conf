# Technicomp Benchtop Linux — Multi-Gen LRU with mild thrash guard
# Source: notes Performance/Memory Management.md (verbatim)
# Checked: CONFIG_LRU_GEN_ENABLED is unset in the SUSE kernel configs
# (Tumbleweed stable, SL-16.0, SL-16.1), so the enabled=y write is required.
# w! writes the values at boot only (see 90-tcbl-thp.conf).
w! /sys/kernel/mm/lru_gen/enabled    - - - - y
w! /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
