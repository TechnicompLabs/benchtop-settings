# TechniComp Benchtop Linux — Transparent Huge Pages
# Source: notes Performance/Memory Management.md
# Goal: maximise 2 MB (PMD) THP coverage to reduce dTLB pressure.
# `always` matches the openSUSE kernel build (CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y);
# the previous `madvise` narrowed THP to regions that ask for it. On x86-64
# hugepages-2048kB/enabled defaults to `inherit`, so this top-level knob is what
# controls the 2 MB size. defrag=defer+madvise keeps direct reclaim/compaction
# for MADV_HUGEPAGE regions and pushes everything else to kswapd/kcompactd in
# the background (kernel default `madvise` does nothing proactive for the rest).
# Measure with thp_fault_alloc / thp_fault_fallback in /proc/vmstat and
# AnonHugePages in /proc/meminfo before changing these.
w /sys/kernel/mm/transparent_hugepage/enabled       - - - - always
w /sys/kernel/mm/transparent_hugepage/defrag        - - - - defer+madvise
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
