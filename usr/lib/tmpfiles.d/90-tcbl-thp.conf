# TechniComp Benchtop Linux — Transparent Huge Pages desktop defaults
# Source: notes Performance/Memory Management.md (verbatim)
# Desktop default = madvise (opt-in); gaming mode flips to `always` at runtime
# and restores these on session end (see gamemode integration).
w /sys/kernel/mm/transparent_hugepage/enabled       - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag        - - - - defer
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
