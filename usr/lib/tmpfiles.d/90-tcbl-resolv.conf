# TechniComp Benchtop Linux - /etc/resolv.conf points at systemd-resolved's stub
# NetworkManager hands DNS to systemd-resolved (NetworkManager/conf.d/90-tcbl-dns.conf);
# programs that read /etc/resolv.conf then query resolved's local stub (127.0.0.53).
# Source: notes Performance/Network Tuning.md
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
