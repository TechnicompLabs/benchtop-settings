<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Technicomp Benchtop Linux: Noto as the default sans-serif and monospace
  fonts, as upstream fontconfig has set them since 2.14 (60-latin.conf), the
  configuration that Flatpak runtimes ship. openSUSE's lists (fonts-config's
  60-family-prefer.conf) would otherwise choose Roboto and Source Code Pro.
  serif needs no rule: with the fonts in the image, openSUSE's list already
  chooses Noto Serif.

  Flatpak apps do not read this file, so it applies only to programs on the
  host. The preferences of an administrator (local.conf, fonts-config) and of
  the user sort before this file, so they come first.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
